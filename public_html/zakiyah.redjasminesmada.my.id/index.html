<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Toko Roti</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8e1d4;
            text-align: center;
        }
        h1 {
            color: #8B4513;
        }
        .profile {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}
		
        img {
            width: 200px;
            height: auto;
            margin: 10px;
        }
        .animated-bread {
            width: 100px;
            position: relative;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>

        <h2>Zakiyah Tri Hapsari</h2>

        <p>Instagram: <a href="https://www.instagram.com/reel/DBtgUb7BRP5/?igsh=eGxwZTdqMXd4MDZz" target="_blank">Link konten</a></p>
