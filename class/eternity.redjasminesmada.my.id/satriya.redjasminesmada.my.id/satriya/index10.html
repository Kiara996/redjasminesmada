<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url('https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.facebook.com%2Fsht.jakut%2F&psig=AOvVaw2OofB19Yf2lbnlKMdLnfmA&ust=1731569443685000&source=images&cd=vfe&opi=89978449&ved=0CBQQjRxqFwoTCNCW3v7k2IkDFQAAAAAdAAAAABAE'); /* Ganti dengan URL gambar latar belakang Anda */
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
        }
        .profile-pic {
            width: 150px; /* Ukuran foto profil */
            height: 150px; /* Ukuran foto profil */
            border-radius: 50%; /* Membuat foto profil menjadi bulat */
            border: 2px solid white; /* Border putih di sekitar foto profil */
            margin: 20px 0; /* Margin atas dan bawah */
        }
        .social-links a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.3); /* Warna latar belakang tautan */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .social-links a:hover {
            background-color: rgba(255, 255, 255, 0.5); /* Efek hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="foto-profil.jpg" alt="Foto Profil" class="profile-pic">
            <h1>Satriya Wibawa</h1>
            <p>WEB PROFILE</p>
        </div>
        <div class="social-links">
            <a href="https://www.tiktok.com/@username" target="_blank">TikTok</a>
            <a href="https://www.youtube.com/channel/yourchannel" target="_blank">YouTube</a>
            <a href="https://www.instagram.com/username" target="_blank">Instagram</a>
        </div>
    </div>
</body>
</html>
