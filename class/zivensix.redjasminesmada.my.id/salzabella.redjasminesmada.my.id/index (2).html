<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Mirip OLX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">OLX Clone</div>
        <nav>
            <ul>
                <li><a href="#">Beranda</a></li>
                <li><a href="#">Kategori</a></li>
                <li><a href="#">Tentang Kami</a></li>
                <li><a href="#">Kontak</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="search-bar">
            <input type="text" placeholder="Cari barang...">
            <button>Cari</button>
        </section>
        <section class="listings">
            <article class="listing">
                <img src="image1.jpg" alt="Barang 1">
                <h2>Judul Barang 1</h2>
                <p>Deskripsi singkat barang 1.</p>
                <span>Rp 1.000.000</span>
            </article>
            <article class="listing">
                <img src="image2.jpg" alt="Barang 2">
                <h2>Judul Barang 2</h2>
                <p>Deskripsi singkat barang 2.</p>
                <span>Rp 500.000</span>
            </article>
            <!-- Tambahkan lebih banyak listing sesuai kebutuhan -->
        </section>
    </main>
    <footer>
        <p>&copy; 2023 OLX Clone. Semua hak dilindungi.</p>
    </footer>
</body>
</html>
